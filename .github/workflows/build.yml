name: Build

on:
  push:
    branches:
      - development
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - development
  # Allow manual dispatch in GH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix local-backend --ignore-scripts
      - run: pnpm verify:release --require-clean
      - name: Test desktop lifecycle and protocol boundaries
        run: pnpm test -- --runInBand tests/desktopLifecycle.integration.spec.js tests/desktopProtocol.spec.js tests/desktopReleaseFoundation.spec.js
      - name: Build unpacked Windows launcher
        run: pnpm desktop:build
      - name: Verify packaged Electron runtime
        run: pnpm desktop:test
      - uses: actions/upload-artifact@v4
        with:
          name: custom-stremio-windows-launcher
          path: dist/windows-launcher/win-unpacked/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile
      - name: Install local backend dependencies
        run: npm ci --prefix local-backend --ignore-scripts
      - name: Verify release foundation
        run: pnpm verify:release --require-clean
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      # Create recursively the destination dir with
      # "--parrents where no error if existing, make parent directories as needed."
      - run: mkdir -p ./build/${{ github.head_ref || github.ref_name }}
      - name: Deploy to GitHub Pages
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # in stremio, we use `feat/features-name` or `fix/this-bug`
          # so we need a recursive creation of the destination dir
          destination_dir: ${{ github.head_ref || github.ref_name }}
          allow_empty_commit: true
