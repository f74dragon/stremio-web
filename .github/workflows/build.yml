name: Build

on:
  push:
    branches:
      - development
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - development
  # Allow manual dispatch in GH
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix local-backend --ignore-scripts
      - run: pnpm verify:release --require-clean
      - name: Test desktop lifecycle and protocol boundaries
        run: pnpm test -- --runInBand tests/desktopLifecycle.integration.spec.js tests/desktopProtocol.spec.js tests/desktopReleaseFoundation.spec.js tests/personalUpdate.spec.js
      - name: Build branded Windows installer
        run: pnpm desktop:installer
      - name: Verify packaged Electron runtime
        run: pnpm desktop:test
        env:
          CUSTOM_STREMIO_TEST_APP_DIRECTORY: dist/windows-installer/win-unpacked
      - name: Verify installed app and data retention
        run: pnpm desktop:installer:test
      - name: Verify personal installed update and recovery
        run: pnpm desktop:update:test
      # Personal use only: validate locally on the runner, without uploading Windows binaries.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile
      - name: Install local backend dependencies
        run: npm ci --prefix local-backend --ignore-scripts
      - name: Verify release foundation
        run: pnpm verify:release --require-clean
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      # Personal fork: validate the web build without publishing it to GitHub Pages.
